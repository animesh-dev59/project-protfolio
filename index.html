<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Portfolio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <!-- NAVBAR -->
  <header class="fixed top-0 left-0 w-full z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="#" class="text-xl font-bold text-white">&lt;Developer/&gt;</a>
      <nav class="hidden md:flex items-center gap-8 text-sm text-slate-300">
        <a href="#about" class="hover:text-cyan-400">About</a>
        <a href="#projects" class="hover:text-cyan-400">Projects</a>
        <a href="#contact" class="hover:text-cyan-400">Contact</a>
      </nav>
      <button id="menu-btn" class="md:hidden text-slate-400"><i data-lucide="menu"></i></button>
    </div>
  </header>
  <!-- HERO SECTION -->
  <section class="pt-32 pb-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid md:grid-cols-2 gap-12 items-center">
      <div class="space-y-6">
        <span class="px-3 py-1 rounded-full bg-cyan-950 text-cyan-400 text-xs font-semibold">Available for Work</span>
        <h1 class="text-4xl sm:text-6xl font-extrabold text-white">Hi, I'm <span class="text-cyan-400">John Doe</span></h1>
        <p class="text-slate-400">Full-Stack Software Engineer building scalable web applications.</p>
        <a href="#contact" class="inline-block px-6 py-3 bg-cyan-400 text-slate-950 font-semibold rounded-lg">Get In Touch</a>
      </div>
    </div>
  </section>
</body>
</html>
